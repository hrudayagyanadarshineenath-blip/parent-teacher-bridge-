<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Parent-Teacher Bridge</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-page">

    <div class="auth-wrapper">

        <!-- =====================================
             LEFT BRANDING SECTION
             ===================================== -->

        <div class="auth-brand">

            <div class="auth-logo">
                🏫
            </div>

            <h1>
                Parent-Teacher<br>Bridge
            </h1>

            <p>
                Connecting parents and teachers
                for a better learning journey.
            </p>


            <div class="auth-features">

                <div>

                    <span>🎙️</span>

                    <p>
                        Voice-first communication
                    </p>

                </div>


                <div>

                    <span>📚</span>

                    <p>
                        Track student progress
                    </p>

                </div>


                <div>

                    <span>🎓</span>

                    <p>
                        Discover government schemes
                    </p>

                </div>

            </div>

        </div>


        <!-- =====================================
             SIGNUP CARD
             ===================================== -->

        <div class="auth-card">

            <!-- HEADER -->

            <div class="auth-header">

                <h2>
                    Create Your Account ✨
                </h2>

                <p>
                    Join Parent-Teacher Bridge and stay connected
                </p>

            </div>


            <!-- =================================
                 SIGNUP FORM
                 ================================= -->

            <form class="auth-form" method="POST" action="{{ url_for('signup') }}">


                <!-- FULL NAME -->

                <div class="auth-field">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input type="text" id="signupName" name="full_name" placeholder="Enter your full name" required>

                </div>


                <!-- ROLE -->

                <div class="auth-field">

                    <label for="signupRole">
                        Account Type
                    </label>

                    <select id="signupRole" name="role" required>

                        <option value="">
                            Choose account type
                        </option>

                        <option value="parent">
                            👨‍👩‍👧 Parent
                        </option>

                        <option value="teacher">
                            👩‍🏫 Teacher
                        </option>

                    </select>

                </div>


                <!-- CONTACT -->

                <div class="auth-field">

                    <label for="signupContact">
                        Email / Phone
                    </label>

                    <input type="text" id="signupContact" name="contact" placeholder="Enter email or phone" required>

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="signupPassword" name="password" placeholder="Create a password"
                            required>

                        <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">

                            👁

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="signupConfirmPassword" name="confirm_password"
                            placeholder="Re-enter your password" required>

                        <button type="button" class="password-toggle"
                            onclick="togglePassword('signupConfirmPassword', this)">

                            👁

                        </button>

                    </div>

                </div>


                <!-- TERMS -->

                <label class="terms-option">

                    <input type="checkbox" id="signupTerms" required>

                    <span>

                        I agree to the

                        <a href="#">
                            Terms & Conditions
                        </a>

                    </span>

                </label>


                <!-- SUBMIT -->

                <button type="submit" class="auth-submit">

                    Create Account

                    <span>→</span>

                </button>

            </form>


            <!-- =================================
                 LOGIN LINK
                 ================================= -->

            <div class="auth-bottom">

                <span>
                    Already have an account?
                </span>

                <a href="{{ url_for('login') }}" id="authBottomButton">

                    Login

                </a>

            </div>


            <!-- =================================
                 HOME
                 ================================= -->

            <div class="auth-home">

                <a href="{{ url_for('home') }}">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- SHARED JAVASCRIPT -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
