<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Parent-Teacher Bridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <!-- =====================================
             LEFT BRANDING SECTION
             ===================================== -->

        <div class="auth-brand">

            <div class="auth-logo">
                🏫
            </div>

            <h1>
                Parent-Teacher<br>Bridge
            </h1>

            <p>
                Connecting parents and teachers
                for a better learning journey.
            </p>

            <div class="auth-features">

                <div>
                    <span>🎙️</span>
                    <p>Voice-first communication</p>
                </div>

                <div>
                    <span>📚</span>
                    <p>Track student progress</p>
                </div>

                <div>
                    <span>🎓</span>
                    <p>Discover government schemes</p>
                </div>

            </div>

        </div>


        <!-- =====================================
             AUTH CARD
             ===================================== -->

        <div class="auth-card">

            <!-- HEADER -->

            <div class="auth-header">

                <h2 id="authTitle">
                    Welcome Back 👋
                </h2>

                <p id="authSubtitle">
                    Login to your Parent-Teacher Bridge account
                </p>

            </div>


            <!-- =================================
                 LOGIN / SIGNUP TABS
                 ================================= -->

            <div class="auth-tabs">

                <button
                    type="button"
                    id="loginTab"
                    class="auth-tab active"
                    onclick="switchAuthMode('login')">

                    Login

                </button>


                <button
                    type="button"
                    id="signupTab"
                    class="auth-tab"
                    onclick="switchAuthMode('signup')">

                    Create Account

                </button>

            </div>


            <!-- =================================
                 LOGIN FORM
                 ================================= -->

            <form
                id="loginForm"
                class="auth-form"
                method="POST"
                action="{{ url_for('login') }}">

                <div class="auth-field">

                    <label for="loginRole">
                        Account Type
                    </label>

                    <select
                        id="loginRole"
                        name="role"
                        required>

                        <option value="">
                            Choose your role
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                        <option value="parent">
                            Parent
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                    </select>

                </div>


                <div class="auth-field">

                    <label for="loginUsername">
                        Username / Phone
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        placeholder="Enter your username or phone number"
                        required>

                </div>


                <div class="auth-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('loginPassword', this)">

                            👁

                        </button>

                    </div>

                </div>


                <div class="auth-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            name="remember">

                        <span>Remember me</span>

                    </label>


                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-submit">

                    Login to Account
                    <span>→</span>

                </button>

            </form>


            <!-- =================================
                 SIGNUP FORM
                 
                 IMPORTANT:
                 Field names match Flask signup()
                 ================================= -->

            <form
                id="signupForm"
                class="auth-form hidden"
                method="POST"
                action="{{ url_for('signup') }}">

                <div class="auth-field">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        name="full_name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="auth-field">

                    <label for="signupRole">
                        Account Type
                    </label>

                    <select
                        id="signupRole"
                        name="role"
                        required>

                        <option value="">
                            Choose account type
                        </option>

                        <option value="parent">
                            👨‍👩‍👧 Parent
                        </option>

                        <option value="teacher">
                            👩‍🏫 Teacher
                        </option>

                    </select>

                </div>


                <div class="auth-field">

                    <label for="signupUsername">
                        Email / Phone
                    </label>

                    <input
                        type="text"
                        id="signupUsername"
                        name="contact"
                        placeholder="Enter email or phone"
                        required>

                </div>


                <div class="auth-field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('signupPassword', this)">

                            👁

                        </button>

                    </div>

                </div>


                <div class="auth-field">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupConfirmPassword"
                            name="confirm_password"
                            placeholder="Re-enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('signupConfirmPassword', this)">

                            👁

                        </button>

                    </div>

                </div>


                <label class="terms-option">

                    <input
                        type="checkbox"
                        id="signupTerms"
                        required>

                    <span>
                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>
                    </span>

                </label>


                <button
                    type="submit"
                    class="auth-submit">

                    Create Account
                    <span>→</span>

                </button>

            </form>


            <!-- =================================
                 BOTTOM SWITCH
                 ================================= -->

            <div class="auth-bottom">

                <span id="authBottomText">
                    Don't have an account?
                </span>

                <button
                    type="button"
                    id="authBottomButton"
                    onclick="switchAuthMode('signup')">

                    Sign Up

                </button>

            </div>


            <!-- =================================
                 HOME LINK
                 ================================= -->

            <div class="auth-home">

                <a href="{{ url_for('home') }}">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- SHARED JAVASCRIPT -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
